name: Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt Pillow pyinstaller
      - name: Generate icon and build executable
        run: |
          python tools/build_icon.py
          python -m PyInstaller --noconfirm --clean vita-pulse.spec
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/vita-pulse.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  vita-pulse.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vita-pulse-windows
          path: |
            dist/vita-pulse.exe
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/vita-pulse.exe dist/SHA256SUMS.txt --generate-notes

